databases:
  - name: novamine-db
    databaseName: novamine
    user: novamine_user
    plan: free
    region: oregon

services:
  # Laravel Web Service
  - type: web
    name: novamine-web
    plan: free
    region: oregon
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: ./start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://novamine-web.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: novamine-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: novamine-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: novamine-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: novamine-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: novamine-db
          property: password
      - key: CACHE_DRIVER
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: BRAVE_SEARCH_RESULT_LIMIT
        value: 10
